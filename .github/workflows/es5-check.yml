name: ES5 Check

# The skin's scripts are concatenated into Classic's global bundle and minified with JSMin:
# one ES2015+ construct takes the whole application down, so every PR is checked for ES5.
on:
  pull_request:
    paths:
      - 'web/**/*.js'
      - '.github/workflows/es5-check.yml'

jobs:
  es5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx -y es-check@9.8.1 es5 'web/**/*.js'
